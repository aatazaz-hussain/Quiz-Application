<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher | QuizMaster</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: #f5f0ff;
      }
      .header {
        background: white;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 10px rgba(138, 43, 226, 0.1);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.3rem;
        font-weight: 700;
        color: #8a2be2;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .btn {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-primary {
        background: #8a2be2;
        color: white;
      }
      .btn-secondary {
        background: #ff6bcb;
        color: white;
      }
      .container {
        display: flex;
        min-height: calc(100vh - 60px);
      }
      .sidebar {
        width: 200px;
        background: white;
        padding: 20px 0;
        border-right: 1px solid #f0f0f0;
      }
      .nav-item {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        color: #666;
        border-left: 3px solid transparent;
      }
      .nav-item:hover,
      .nav-item.active {
        background: #f5f0ff;
        color: #8a2be2;
        border-left: 3px solid #8a2be2;
      }
      .main-content {
        flex: 1;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(138, 43, 226, 0.08);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin: 20px 0;
      }
      .stat {
        text-align: center;
        padding: 15px;
      }
      .stat-number {
        font-size: 2rem;
        font-weight: 700;
        color: #8a2be2;
        margin: 5px 0;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin: 15px 0;
      }
      .action-btn {
        padding: 12px;
        background: #f5f0ff;
        border: 1px solid #e0d6f5;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #f0f0f0;
      }
      th {
        background: #f5f0ff;
        color: #666;
      }
      .badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.85rem;
      }
      .published {
        background: #e6f7ff;
        color: #1890ff;
      }
      .draft {
        background: #fff1f0;
        color: #ff4d4f;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 400px;
        max-width: 90%;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .close {
        font-size: 1.5rem;
        cursor: pointer;
      }
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 8px;
        border: 1px solid #e0d6f5;
        border-radius: 6px;
      }
      .chat-box {
        height: 300px;
        border: 1px solid #e0d6f5;
        border-radius: 8px;
        padding: 15px;
        overflow-y: auto;
        margin-bottom: 15px;
      }
      .message {
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 70%;
      }
      .sent {
        background: #f5f0ff;
        margin-left: auto;
      }
      .received {
        background: #e6f7ff;
      }
      .notification-item {
        padding: 10px;
        border-bottom: 1px solid #f0f0f0;
      }
      .quiz-item {
        padding: 12px;
        border-bottom: 1px solid #f0f0f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .question-form {
        border: 1px solid #e0d6f5;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        background: #fafaff;
      }
      .question-form h4 {
        margin-bottom: 10px;
        color: #8a2be2;
      }
      .question-form input,
      .question-form select {
        margin-bottom: 10px;
        padding: 8px;
        border: 1px solid #e0d6f5;
        border-radius: 6px;
        width: 100%;
        background: white;
      }
      .question-form input:focus,
      .question-form select:focus {
        outline: none;
        border-color: #8a2be2;
      }
      .options-container {
        margin: 10px 0;
        padding: 10px;
        background: white;
        border-radius: 6px;
        border: 1px solid #e0d6f5;
      }
      .options-container h5 {
        margin-bottom: 10px;
        color: #666;
      }
      .option-row {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        gap: 10px;
      }
      .option-text {
        flex: 1;
        padding: 8px;
        border: 1px solid #e0d6f5;
        border-radius: 6px;
        background: white;
      }
      .option-text:focus {
        outline: none;
        border-color: #8a2be2;
      }
      .checkbox-container {
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      .checkbox-container input[type="checkbox"] {
        margin-right: 5px;
      }
      .remove-option,
      .remove-question,
      .add-option {
        background: #ff6bcb;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 5px;
        font-weight: 600;
      }
      .remove-question {
        background: #ff4d4f;
      }
      .add-option {
        background: #8a2be2;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo"><i class="fas fa-brain"></i> QuizMaster</div>
      <div class="user-info">
        <span id="teacherName">Prof. Teacher</span>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="container">
      <div class="sidebar">
        <div class="nav-item active" onclick="loadPage('dashboard')">
          <i class="fas fa-home"></i> Dashboard
        </div>
        <div class="nav-item" onclick="loadPage('quizzes')">
          <i class="fas fa-puzzle-piece"></i> Quizzes
        </div>
        <div class="nav-item" onclick="loadPage('results')">
          <i class="fas fa-chart-bar"></i> Results
        </div>
        <div class="nav-item" onclick="loadPage('messages')">
          <i class="fas fa-comments"></i> Messages
        </div>
        <div class="nav-item" onclick="loadPage('notifications')">
          <i class="fas fa-bell"></i> Notifications
        </div>
      </div>

      <div class="main-content" id="content"></div>
    </div>

    <div class="modal" id="quizModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Create Quiz</h3>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="form-group">
          <label>Title</label><input type="text" id="quizTitle" />
        </div>
        <div class="form-group">
          <label>Description</label><textarea id="quizDesc" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Category</label
          ><select id="quizCat">
            <option>Math</option>
            <option>Science</option>
            <option>History</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="saveQuiz()">Create</button>
      </div>
    </div>

    <!-- Update the messageModal div -->
    <div class="modal" id="messageModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>New Message</h3>
          <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="form-group">
          <label>To</label>
          <select id="msgTo">
            <option value="0">All Students</option>
            <option value="specific">Specific Student</option>
          </select>
        </div>
        <div
          class="form-group"
          id="studentSelectContainer"
          style="display: none"
        >
          <label>Select Student</label>
          <select id="msgStudent">
            <!-- Will be populated dynamically -->
          </select>
        </div>
        <div class="form-group">
          <label>Message</label><textarea id="msgText" rows="3"></textarea>
        </div>
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <div class="modal" id="questionsModal">
      <div class="modal-content" style="width: 600px">
        <div class="modal-header">
          <h3 id="quizTitleForQuestions">Manage Questions</h3>
          <span class="close" onclick="closeQuestionsModal()">&times;</span>
        </div>
        <div id="questionsList"></div>
        <div
          class="form-group"
          style="
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
          "
        >
          <button class="btn btn-primary" onclick="addNewQuestion()">
            Add New Question
          </button>
          <button class="btn btn-secondary" onclick="saveQuestions()">
            Save All Questions
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentPage = "dashboard";
      let currentQuizId = null;
      let allStudents = [];

      function checkAuth() {
        const token = localStorage.getItem("token");
        const userType = localStorage.getItem("userType");

        if (!token || userType !== "teacher") {
          window.location.href = "login.html";
          return;
        }

        document.getElementById("teacherName").textContent =
          "Prof. " + localStorage.getItem("userName");
        loadDashboard();
      }

      async function loadDashboard() {
        document.getElementById("content").innerHTML = `
        <div class="card"><h2>Welcome, Professor!</h2><p>Manage your classroom activities</p></div>
       <div class="stats">
    <div class="stat">
        <div class="stat-number">📘</div>
        <p>"A good teacher can inspire hope."</p>
    </div>
    <div class="stat">
        <div class="stat-number">🌟</div>
        <p>"Teaching is the profession that creates all others."</p>
    </div>
    <div class="stat">
        <div class="stat-number">🎓</div>
        <p>"Great teachers shape the future."</p>
    </div>
    <div class="stat">
        <div class="stat-number">💡</div>
        <p>"The best teachers teach from the heart."</p>
    </div>
</div>

        <div class="card"><h3>Quick Actions</h3>
            <div class="actions">
                <div class="action-btn" onclick="openQuizModal()"><i class="fas fa-plus"></i> Create Quiz</div>
                <div class="action-btn" onclick="loadPage('results')"><i class="fas fa-chart-bar"></i> View Results</div>
                <div class="action-btn" onclick="openMessageModal()"><i class="fas fa-comments"></i> Message</div>
                <div class="action-btn" onclick="createNotification()"><i class="fas fa-bell"></i> Notify</div>
            </div>
        </div>
        <div class="card"><h3>Recent Quizzes</h3>
            <div id="recentQuizzes">Loading...</div>
        </div>
    `;

        try {
          const token = localStorage.getItem("token");
          const response = await fetch("http://localhost:8080/api/quizzes", {
            headers: { Authorization: token },
          });

          if (response.ok) {
            const quizzes = await response.json();
            document.getElementById("quizCount").textContent = quizzes.length;

            const recentDiv = document.getElementById("recentQuizzes");
            recentDiv.innerHTML = quizzes
              .slice(0, 4)
              .map(
                (q) =>
                  `<div class="quiz-item">
                    <div><strong>${q.title}</strong><p>${
                    q.subject || "General"
                  } • Submissions: ${q.submissions || 0}</p></div>
                    <span class="badge ${q.status || "draft"}">${
                    q.status || "draft"
                  }</span>
                </div>`
              )
              .join("");
          }
        } catch (error) {
          console.log("Error loading dashboard");
        }
      }

      async function loadQuizzes() {
        document.getElementById("content").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2>My Quizzes</h2>
            <button class="btn btn-primary" onclick="openQuizModal()"><i class="fas fa-plus"></i> New Quiz</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Title</th><th>Subject</th><th>Status</th><th>Submissions</th><th>Actions</th></tr></thead>
                <tbody id="quizzesTableBody">Loading quizzes...</tbody>
            </table>
        </div>
    `;

        try {
          const token = localStorage.getItem("token");
          const response = await fetch("http://localhost:8080/api/quizzes", {
            headers: { Authorization: token },
          });

          if (response.ok) {
            const quizzes = await response.json();
            const tableBody = document.getElementById("quizzesTableBody");

            if (quizzes.length === 0) {
              tableBody.innerHTML =
                '<tr><td colspan="5">No quizzes found</td></tr>';
              return;
            }

            tableBody.innerHTML = quizzes
              .map(
                (q) => `
                <tr>
                    <td>${q.title}</td>
                    <td>${q.subject || "General"}</td>
                    <td><span class="badge ${q.status || "draft"}">${
                  q.status || "draft"
                }</span></td>
                    <td>${q.submissions || 0}</td>
                    <td>
                        <button class="btn" style="padding:4px 8px; margin-right:5px;" onclick="editQuiz(${
                          q.id
                        })">Edit</button>
                        <button class="btn btn-primary" style="padding:4px 8px; margin-right:5px;" onclick="manageQuestions(${
                          q.id
                        }, '${q.title}')">Manage Questions</button>
                        <button class="btn btn-secondary" style="padding:4px 8px;" onclick="togglePublish(${
                          q.id
                        }, '${q.status}')">${
                  q.status === "published" ? "Unpublish" : "Publish"
                }</button>
                    </td>
                </tr>`
              )
              .join("");
          }
        } catch (error) {
          document.getElementById("quizzesTableBody").innerHTML =
            '<tr><td colspan="5">Error loading quizzes</td></tr>';
        }
      }
      async function loadResults() {
        document.getElementById("content").innerHTML = `
        <h2>Student Results</h2>
        <div class="card">
            <table>
                <thead><tr><th>Student</th><th>Quiz</th><th>Score</th><th>Date</th></tr></thead>
                <tbody id="resultsTableBody">Loading results...</tbody>
            </table>
        </div>
    `;

        try {
          const token = localStorage.getItem("token");
          // Use teacher results endpoint
          const response = await fetch(
            "http://localhost:8080/api/teacher/results",
            {
              headers: { Authorization: token },
            }
          );

          if (response.ok) {
            const results = await response.json();
            const tableBody = document.getElementById("resultsTableBody");

            if (results.length === 0) {
              tableBody.innerHTML =
                '<tr><td colspan="4">No results found</td></tr>';
              return;
            }

            tableBody.innerHTML = results
              .map(
                (r) =>
                  `<tr>
                    <td>${r.studentName || "Student " + r.studentId}</td>
                    <td>${r.quizTitle || "Quiz " + r.quizId}</td>
                    <td>${r.totalScore || 0}/${r.maxScore || 100} (${
                    r.percentage || 0
                  }%)</td>
                    <td>${
                      r.submissionDate || new Date().toISOString().split("T")[0]
                    }</td>
                </tr>`
              )
              .join("");
          } else {
            document.getElementById("resultsTableBody").innerHTML =
              '<tr><td colspan="4">Error loading results</td></tr>';
          }
        } catch (error) {
          document.getElementById("resultsTableBody").innerHTML =
            '<tr><td colspan="4">Error loading results</td></tr>';
        }
      }

    async function loadMessages() {
    document.getElementById("content").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2>Messages</h2>
            <button class="btn btn-primary" onclick="openMessageModal()"><i class="fas fa-plus"></i> New</button>
        </div>
        
        <div style="display:flex; gap:20px;">
            <div class="card" style="width: 300px; max-height: 500px; overflow-y: auto;">
                <h3>Students</h3>
                <div id="studentList">Loading students...</div>
            </div>
            
            <div class="card" style="flex: 1;">
                <div style="margin-bottom:15px;">
                    <h3 id="selectedStudentName">Select a student to view conversation</h3>
                    <div id="selectedStudentInfo" style="color: #666; font-size: 0.9em; margin-bottom: 10px;"></div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <input type="text" id="newMsg" placeholder="Type your message..." style="flex:1;">
                        <button class="btn btn-primary" onclick="sendToSelectedStudent()">Send</button>
                    </div>
                </div>
                
                <div class="chat-box" id="chatBox" style="height: 350px;">
                    Please select a student from the left panel
                </div>
            </div>
        </div>
    `;

    await loadStudentsForMessages();
}

let selectedStudentId = null;
let selectedStudentName = null;

async function loadStudentsForMessages() {
    try {
        const token = localStorage.getItem("token");
        const userId = localStorage.getItem("userId");
        
        const studentsResponse = await fetch("http://localhost:8080/api/students", {
            headers: { Authorization: token },
        });

        if (!studentsResponse.ok) {
            document.getElementById("studentList").innerHTML = "<p>Error loading students</p>";
            return;
        }

        const students = await studentsResponse.json();
        const studentListDiv = document.getElementById("studentList");

        if (students.length === 0) {
            studentListDiv.innerHTML = "<p>No students found</p>";
            return;
        }

        const messagesResponse = await fetch("http://localhost:8080/api/messages", {
            headers: { Authorization: token },
        });

        let allMessages = [];
        if (messagesResponse.ok) {
            allMessages = await messagesResponse.json();
        }

        studentListDiv.innerHTML = students.map((student) => {
            const studentMessages = allMessages.filter(m => 
                (m.senderId == student.id && m.receiverId == userId) ||
                (m.senderId == userId && m.receiverId == student.id)
            );
            
            const unreadCount = studentMessages.filter(m => 
                m.senderId == student.id && 
                m.receiverId == userId &&
                m.isRead === false
            ).length;

            const lastMessage = studentMessages.length > 0 
                ? studentMessages[studentMessages.length - 1] 
                : null;

            let lastMsgPreview = lastMessage 
                ? (lastMessage.content.length > 30 
                    ? lastMessage.content.substring(0, 30) + "..."
                    : lastMessage.content)
                : "No messages yet";

            const isLastFromStudent = lastMessage && lastMessage.senderId == student.id;

            return `
                <div class="student-item" 
                     data-student-id="${student.id}"
                     data-student-name="${student.name}"
                     data-unread-count="${unreadCount}"
                     style="padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer;"
                     onclick="selectStudent(${student.id}, '${student.name.replace(/'/g, "\\'")}', ${unreadCount})">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <strong>${student.name}</strong>
                        ${unreadCount > 0 
                            ? `<span style="background: #ff4d4f; color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.8em;">${unreadCount}</span>`
                            : ""}
                    </div>
                    <div style="color: #666; font-size: 0.9em; margin-top: 5px;">
                        ${isLastFromStudent ? "📥 " : "📤 "}${lastMsgPreview}
                    </div>
                </div>
            `;
        }).join("");

        let studentToSelect = null;
        const studentItems = document.querySelectorAll('.student-item');
        for (const item of studentItems) {
            const unreadCount = parseInt(item.getAttribute('data-unread-count'));
            if (unreadCount > 0) {
                const studentId = item.getAttribute('data-student-id');
                const studentName = item.getAttribute('data-student-name');
                studentToSelect = { id: studentId, name: studentName };
                break;
            }
        }

        if (!studentToSelect && students.length > 0) {
            studentToSelect = { id: students[0].id, name: students[0].name };
        }

        if (studentToSelect) {
            setTimeout(() => {
                selectStudent(studentToSelect.id, studentToSelect.name, 0);
            }, 100);
        }
    } catch (error) {
        console.error("Error loading students:", error);
        document.getElementById("studentList").innerHTML = "<p>Error loading students</p>";
    }
}

async function selectStudent(studentId, studentName, unreadCount = 0) {
    selectedStudentId = studentId;
    selectedStudentName = studentName;
    
    document.getElementById('selectedStudentName').textContent = `Conversation with ${studentName}`;
    document.getElementById('selectedStudentInfo').innerHTML = 
        `Student ID: ${studentId} | Unread: ${unreadCount}`;
    
    document.querySelectorAll('.student-item').forEach(item => {
        item.style.background = 'white';
        item.style.borderLeft = 'none';
        item.style.fontWeight = 'normal';
    });

    const selectedItem = document.querySelector(`.student-item[data-student-id="${studentId}"]`);
    if (selectedItem) {
        selectedItem.style.background = '#f5f0ff';
        selectedItem.style.borderLeft = '3px solid #8a2be2';
        selectedItem.style.fontWeight = 'bold';
        
        const badge = selectedItem.querySelector('span');
        if (badge && unreadCount === 0) {
            badge.style.display = 'none';
        }
    }

    await loadConversation(studentId);
    
    if (unreadCount > 0) {
        await markMessagesAsRead(studentId);
    }
}

async function loadConversation(studentId) {
    try {
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');
        
        let messages = [];
        
        try {
            const response = await fetch(`http://localhost:8080/api/messages/conversation?userId=${studentId}`, {
                headers: { 'Authorization': token }
            });
            
            if(response.ok) {
                messages = await response.json();
            }
        } catch(e) {}

        if(messages.length === 0) {
            const allMessagesResponse = await fetch('http://localhost:8080/api/messages', {
                headers: { 'Authorization': token }
            });
            
            if(allMessagesResponse.ok) {
                const allMessages = await allMessagesResponse.json();
                messages = allMessages.filter(m => 
                    (m.senderId == studentId && m.receiverId == userId) ||
                    (m.senderId == userId && m.receiverId == studentId)
                );
            }
        }
        
        const chatBox = document.getElementById('chatBox');
        
        if(messages.length === 0) {
            chatBox.innerHTML = '<p>No messages with this student yet. Start a conversation!</p>';
            return;
        }
        
        messages.sort((a, b) => {
            const dateA = a.createdAt ? new Date(a.createdAt) : new Date(0);
            const dateB = b.createdAt ? new Date(b.createdAt) : new Date(0);
            return dateA - dateB;
        });
        
        chatBox.innerHTML = messages.map(m => {
            const isSent = m.senderId == userId;
            const senderName = isSent ? 'You' : selectedStudentName;
            const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Recent';
            const isUnread = !isSent && m.isRead === false;
            
            return `
            <div class="message ${isSent ? 'sent' : 'received'}" data-message-id="${m.id}">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <strong>${senderName}</strong>
                    <small style="color: #666;">${time}</small>
                </div>
                <p style="margin-top: 5px;">${m.content || ''}</p>
                ${isUnread ? '<div style="font-size:0.7em; color:#8a2be2; margin-top:3px;">🆕 NEW</div>' : ''}
            </div>`;
        }).join('');
        
        chatBox.scrollTop = chatBox.scrollHeight;
        
    } catch(error) {
        console.error('Error loading conversation:', error);
        document.getElementById('chatBox').innerHTML = '<p>Error loading messages</p>';
    }
}

      async function saveQuestions() {
        if (!currentQuizId) {
          alert("No quiz selected!");
          return;
        }

        const questions = [];
        const questionForms = document.querySelectorAll(".question-form");

        if (questionForms.length === 0) {
          alert("Please add at least one question!");
          return;
        }

        let hasError = false;

        for (let i = 0; i < questionForms.length; i++) {
          const form = questionForms[i];
          const questionText = form.querySelector(".question-text").value;
          const questionType = form.querySelector(".question-type").value;
          const questionPoints = form.querySelector(".question-points").value;

          if (!questionText.trim()) {
            alert(`Question ${i + 1} is empty! Please add text.`);
            hasError = true;
            break;
          }

          const options = [];
          const optionRows = form.querySelectorAll(".option-row");

          for (let j = 0; j < optionRows.length; j++) {
            const row = optionRows[j];
            const optionText = row.querySelector(".option-text").value;
            const isCorrect = row.querySelector(".is-correct").checked;

            if (!optionText.trim()) {
              alert(`Option ${j + 1} in Question ${i + 1} is empty!`);
              hasError = true;
              break;
            }

            options.push({
              text: optionText.trim(),
              isCorrect: isCorrect,
            });
          }

          if (hasError) break;

          // For single choice, ensure exactly one correct option
          if (questionType === "single_choice") {
            const correctOptions = options.filter((opt) => opt.isCorrect);
            if (correctOptions.length !== 1) {
              alert(
                `Question ${
                  i + 1
                }: Single choice questions need exactly 1 correct option!`
              );
              hasError = true;
              break;
            }
          }

          // For multiple choice, ensure at least one correct option
          if (questionType === "multiple_choice") {
            const correctOptions = options.filter((opt) => opt.isCorrect);
            if (correctOptions.length === 0) {
              alert(
                `Question ${
                  i + 1
                }: Multiple choice questions need at least 1 correct option!`
              );
              hasError = true;
              break;
            }
          }

          questions.push({
            text: questionText.trim(),
            type: questionType,
            points: parseInt(questionPoints) || 1,
            options: options,
          });
        }

        if (hasError) return;

        const token = localStorage.getItem("token");

        try {
          for (let i = 0; i < questions.length; i++) {
            const q = questions[i];

            // Send the complete question data including options with isCorrect flag
            const response = await fetch(
              `http://localhost:8080/api/questions`,
              {
                method: "POST",
                headers: {
                  Authorization: token,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  quizId: currentQuizId,
                  text: q.text,
                  type: q.type,
                  points: q.points,
                  options: q.options.map((opt) => opt.text), // Send only the option texts as array
                  correctOptionIndex: q.options.findIndex(
                    (opt) => opt.isCorrect
                  ),
                }),
              }
            );
            if (!response.ok) {
              const errorText = await response.text();
              console.error("Error response:", errorText);
              throw new Error(`Failed to save question ${i + 1}: ${errorText}`);
            }

            const result = await response.json();
            console.log("Save result:", result);

            if (!result.success) {
              throw new Error(
                `Failed to save question ${i + 1}: ${
                  result.message || "Unknown error"
                }`
              );
            }

            // Small delay to prevent overwhelming the server
            await new Promise((resolve) => setTimeout(resolve, 100));
          }

          alert("All questions saved successfully!");
          closeQuestionsModal();
        } catch (error) {
          console.error("Error saving questions:", error);
          alert("Error saving questions: " + error.message);
        }
      }

            headers: { Authorization: token },
          });

          if (response.ok) {
            const result = await response.json();
            if (result.success) {
              alert("Quiz updated successfully!");
              loadPage("quizzes");
            } else {
              alert("Failed to update quiz");
            }
          } else {
            alert("Failed to update quiz");
          }
        } catch (error) {
          alert("Server error");
        }
      }

      async function togglePublish(quizId, currentStatus) {
        const newStatus = currentStatus === "published" ? "draft" : "published";

        try {
          const token = localStorage.getItem("token");
          const url = `http://localhost:8080/api/quizzes/publish?quizId=${quizId}`;

          const response = await fetch(url, {
            method: "POST",
            headers: { Authorization: token },
          });

          if (response.ok) {
            const result = await response.json();
            if (result.success) {
              alert(`Quiz ${quizId} status changed to ${newStatus}`);
              loadPage("quizzes");
            } else {
              alert("Failed to change quiz status");
            }
          } else {
            alert("Failed to change quiz status");
          }
        } catch (error) {
          alert("Server error");
        }
      }

      async function logout() {
        try {
          const token = localStorage.getItem("token");
          await fetch("http://localhost:8080/api/logout", {
            method: "POST",
            headers: { Authorization: token },
          });
        } catch (error) {
          console.log("Logout error");
        }

        localStorage.clear();
        window.location.href = "index.html";
      }

      window.onclick = function (e) {
        if (e.target.classList.contains("modal")) {
          closeModal();
          closeQuestionsModal();
        }
      };

      checkAuth();
    </script>
  </body>
</html>
