<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | QuizMaster</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: #f5f0ff;
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: white;
            padding: 30px 0;
            box-shadow: 4px 0 15px rgba(138, 43, 226, 0.08);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 25px 30px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #8a2be2;
            border-bottom: 2px solid #f5f0ff;
        }
        
        .nav-links {
            padding: 20px 0;
        }
        
        .nav-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        
        .nav-item:hover, .nav-item.active {
            background: #f5f0ff;
            color: #8a2be2;
            border-left: 4px solid #8a2be2;
        }
        
        .main-content {
            flex: 1;
            padding: 30px;
        }
        
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logout-btn {
            padding: 8px 20px;
            background: #ff6bcb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.08);
        }
        
        .card-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffeff9, #f1e6ff);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .card-icon i {
            font-size: 1.8rem;
            color: #8a2be2;
        }
        
        .card h3 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .card p {
            color: #666;
        }
        
        .users-table {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.08);
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .table-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #8a2be2;
            color: white;
        }
        
        .btn-secondary {
            background: #ff6bcb;
            color: white;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            text-align: left;
            padding: 15px;
            background: #f5f0ff;
            color: #666;
            font-weight: 600;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .user-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .student-badge {
            background: #ffeff9;
            color: #ff6bcb;
        }
        
        .teacher-badge {
            background: #f1e6ff;
            color: #8a2be2;
        }
        
        .admin-badge {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .action-btns {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }
        
        .edit-btn {
            background: #e6f7ff;
            color: #1890ff;
        }
        
        .delete-btn {
            background: #fff1f0;
            color: #ff4d4f;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .close-modal {
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0d6f5;
            border-radius: 8px;
        }
        
        #extraField {
            display: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-brain"></i>
            <span>QuizMaster</span>
        </div>
        
        <div class="nav-links">
            <div class="nav-item active" onclick="showDashboard()">
                <i class="fas fa-chart-bar"></i>
                <span>Dashboard</span>
            </div>
            <div class="nav-item" onclick="showUserManagement()">
                <i class="fas fa-users"></i>
                <span>User Management</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </div>
            <div class="nav-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Logout</span>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1 id="pageTitle">Admin Dashboard</h1>
            <div class="user-info">
                <span id="adminName">Welcome, Admin</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div id="dashboardContent">
            <div class="dashboard-cards">
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                    <h3 id="totalStudents">0</h3>
                    <p>Students</p>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <h3 id="totalTeachers">0</h3>
                    <p>Teachers</p>
                </div>
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-poll"></i>
                    </div>
                    <h3 id="totalQuizzes">0</h3>
                    <p>Active Quizzes</p>
                </div>
            </div>
            
            <div class="card">
                <h3 style="margin-bottom:20px;">Recent Activity</h3>
                <div id="recentActivity">
                    <p>Loading activity...</p>
                </div>
            </div>
        </div>
        
        <div id="userManagementContent" style="display:none;">
            <div class="users-table">
                <div class="table-header">
                    <h3>All Users</h3>
                    <div class="table-actions">
                        <button class="btn btn-primary" onclick="openAddUserModal()">
                            <i class="fas fa-plus"></i> Add User
                        </button>
                        <button class="btn btn-secondary" onclick="loadUsers()">
                            <i class="fas fa-sync"></i> Refresh
                        </button>
                    </div>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New User</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="userName">
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="userEmail">
            </div>
            
            <div class="form-group">
                <label>User Type</label>
                <select id="userType" onchange="updateExtraField()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            
            <div class="form-group" id="extraField">
                <label id="extraLabel">Enrollment Number</label>
                <input type="text" id="userExtra">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="userPassword">
            </div>
            
            <button class="btn btn-primary" style="width:100%;" onclick="saveUser()">Save User</button>
        </div>
    </div>

    <script>
        let currentEditId = null;
        let allUsers = [];
        
        function checkAuth() {
            const token = localStorage.getItem('token');
            const userType = localStorage.getItem('userType');
            
            if(!token || userType !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('adminName').textContent = 'Welcome, Admin';
            loadDashboard();
        }
        
        async function loadDashboard() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:8080/api/users', {
                    headers: { 'Authorization': token }
                });
                
                if(response.ok) {
                    const users = await response.json();
                    allUsers = users;
                    
                    document.getElementById('totalUsers').textContent = users.length;
                    document.getElementById('totalStudents').textContent = users.filter(u => u.userType === 'student').length;
                    document.getElementById('totalTeachers').textContent = users.filter(u => u.userType === 'teacher').length;
                    document.getElementById('totalQuizzes').textContent = '0';
                    
                    const recent = users.slice(0, 3);
                    const activityDiv = document.getElementById('recentActivity');
                    activityDiv.innerHTML = recent.map(u => 
                        `<p>New ${u.userType} registration: ${u.name}</p>`
                    ).join('');
                }
            } catch(error) {
                console.log('Error loading dashboard');
            }
        }
        
        function showDashboard() {
            document.getElementById('dashboardContent').style.display = 'block';
            document.getElementById('userManagementContent').style.display = 'none';
            document.getElementById('pageTitle').textContent = 'Admin Dashboard';
            updateNav('dashboard');
            loadDashboard();
        }
        
        function showUserManagement() {
            document.getElementById('dashboardContent').style.display = 'none';
            document.getElementById('userManagementContent').style.display = 'block';
            document.getElementById('pageTitle').textContent = 'User Management';
            updateNav('users');
            loadUsers();
        }
        
        function updateNav(active) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            if(active === 'dashboard') {
                document.querySelector('.nav-item:nth-child(1)').classList.add('active');
            } else {
                document.querySelector('.nav-item:nth-child(2)').classList.add('active');
            }
        }
        
        async function loadUsers() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:8080/api/users', {
                    headers: { 'Authorization': token }
                });
                
                if(response.ok) {
                    const users = await response.json();
                    renderUsersTable(users);
                } else {
                    document.getElementById('usersTableBody').innerHTML = 
                        '<tr><td colspan="5">Error loading users</td></tr>';
                }
            } catch(error) {
                document.getElementById('usersTableBody').innerHTML = 
                    '<tr><td colspan="5">Server error</td></tr>';
            }
        }
        
        function renderUsersTable(users) {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = '';
            
            if(users.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5">No users found</td></tr>';
                return;
            }
            
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="user-type ${user.userType}-badge">${user.userType}</span></td>
                    <td>
                        <div class="action-btns">
                            <button class="action-btn delete-btn" onclick="deleteUser(${user.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        function updateExtraField() {
            const type = document.getElementById('userType').value;
            const extraField = document.getElementById('extraField');
            const extraLabel = document.getElementById('extraLabel');
            
            if(type === 'admin') {
                extraField.style.display = 'none';
            } else {
                extraField.style.display = 'block';
                if(type === 'student') {
                    extraLabel.textContent = 'Enrollment Number';
                } else {
                    extraLabel.textContent = 'Employee ID';
                }
            }
        }
        
        function openAddUserModal() {
            document.getElementById('modalTitle').textContent = 'Add New User';
            clearModalForm();
            document.getElementById('userModal').style.display = 'flex';
        }
        
        function clearModalForm() {
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userType').value = 'student';
            document.getElementById('userExtra').value = '';
            document.getElementById('userPassword').value = '';
            currentEditId = null;
            updateExtraField();
        }
        
        function closeModal() {
            document.getElementById('userModal').style.display = 'none';
            clearModalForm();
        }
        
        async function saveUser() {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const type = document.getElementById('userType').value;
            const extra = document.getElementById('userExtra').value;
            const password = document.getElementById('userPassword').value;
            
            if(!name || !email || !password) {
                alert('Please fill all required fields');
                return;
            }
            
            if(type !== 'admin' && !extra) {
                alert('Please fill the required extra field');
                return;
            }
            
            const url = `http://localhost:8080/api/register?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&userType=${encodeURIComponent(type)}&extra=${encodeURIComponent(extra)}`;
            
            try {
                const response = await fetch(url, {method: 'POST'});
                const result = await response.json();
                
                if(result.success) {
                    alert('User created successfully');
                    closeModal();
                    loadUsers();
                    loadDashboard();
                } else {
                    alert('Failed to create user');
                }
            } catch(error) {
                alert('Server error');
            }
        }
        
        async function deleteUser(userId) {
            if(!confirm('Are you sure you want to delete this user?')) {
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const url = `http://localhost:8080/api/delete-user?userId=${userId}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': token }
                });
                
                if(response.ok) {
                    alert('User deleted');
                    loadUsers();
                    loadDashboard();
                } else {
                    alert('Failed to delete user');
                }
            } catch(error) {
                alert('Server error');
            }
        }
        
        async function logout() {
            try {
                const token = localStorage.getItem('token');
                await fetch('http://localhost:8080/api/logout', {
                    method: 'POST',
                    headers: { 'Authorization': token }
                });
            } catch(error) {
                console.log('Logout error');
            }
            
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        window.onclick = function(event) {
            if(event.target.classList.contains('modal')) {
                closeModal();
            }
        };
        
        updateExtraField();
        checkAuth();
    </script>
</body>
</html>
